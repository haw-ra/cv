<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل البيانات الأساسية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        .form-container { max-width: 700px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .helptext { font-size: 0.85rem; color: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2 class="text-primary mb-4 text-center">تعديل البيانات الأساسية</h2>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mt-4">
                <!-- زر الحفظ والانتقال للتالي -->
                <button type="submit" name="save_action" value="next" class="btn btn-primary btn-lg shadow-sm w-100">
                    حفظ والانتقال للتالي ➡️
                </button>

                <!-- زر الحفظ والعودة للوحة التحكم -->
                <button type="submit" name="save_action" value="exit" class="btn btn-success btn-lg shadow-sm w-100">
                    حفظ والعودة للوحة التحكم 🏠
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
