<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطوة 3: الخبرات والمشاريع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        .form-container { max-width: 600px; margin: 50px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .step-indicator { color: #6c757d; font-size: 0.9rem; margin-bottom: 20px; }
        @media (max-width: 768px) {
            .form-container { padding: 20px !important; margin: 20px 15px !important; }
            .form-container .btn { width: 100% !important; margin-top: 0.75rem !important; }
            .form-container form p { width: 100% !important; }
            .form-container form p input,
            .form-container form p textarea,
            .form-container form p select { width: 100% !important; box-sizing: border-box !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <div class="text-center step-indicator">الخطوة 3 من 4</div>
        <h2 class="text-center text-primary mb-4">أضف خبراتك أو مشاريعك</h2>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="d-flex flex-column flex-md-row justify-content-between gap-2 mt-4">
                <button type="submit" name="save_action" value="add_another" class="btn btn-secondary shadow-sm flex-grow-1">
                    حفظ وإضافة آخر ➕
                </button>
                <button type="submit" name="save_action" value="next" class="btn btn-primary shadow-sm flex-grow-1">
                    حفظ والانتقال للمهارات 💾
                </button>
            </div>
            
            <div class="d-flex flex-column flex-md-row justify-content-center gap-2 mt-2">
                <a href="{% url 'add_skill' profile.id %}" class="btn btn-outline-secondary shadow-sm flex-grow-1">
                    تخطي للمهارات ⏭️
                </a>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-dark shadow-sm flex-grow-1">
                    لوحة التحكم 🏠
                </a>
            </div>
            
        </form>
    </div>
</div>

</body>
</html>
