<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء سيرة ذاتية</title>
    <!-- استدعاء Bootstrap للتصميم -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        .form-container { max-width: 600px; margin: 50px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2 class="text-center text-primary mb-4">أدخل بياناتك الأساسية</h2>
        
        <!-- الفورمة التي سترسل البيانات إلى views.py -->
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %} <!-- كود حماية إجباري من جانغو -->
            
            {{ form.as_p }} <!-- أمر جانغو السحري لعرض كل حقول الإدخال -->

            
            <button type="submit" class="btn btn-primary w-100 mt-4 fs-5">حفظ وبناء السيرة الذاتية</button>
        </form>
    </div>
</div>

</body>
</html>
