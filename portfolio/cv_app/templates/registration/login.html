{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d6efd, #0dcaf0); min-height: 100vh; display: flex; align-items: center; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        .login-card { background: #fff; border-radius: 15px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        .login-title { color: #2c3e50; font-weight: bold; text-align: center; margin-bottom: 30px; }
        .error-msg { color: #dc3545; font-size: 0.9rem; text-align: center; margin-bottom: 15px; }
        @media (max-width: 768px) {
            .login-card { padding: 25px 20px !important; margin: 20px 15px !important; }
            .login-card .btn { width: 100% !important; margin-bottom: 0.5rem !important; }
            .login-card input { width: 100% !important; box-sizing: border-box !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2 class="login-title">🔐 تسجيل الدخول</h2>

            {% if form.errors %}
                <div class="error-msg">❌ اسم المستخدم أو كلمة المرور غير صحيحة. حاول مرة أخرى.</div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" name="username" class="form-control form-control-lg" placeholder="أدخل اسم المستخدم" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">تسجيل الدخول</button>
                <input type="hidden" name="next" value="{{ next }}">
            </form>

            <div class="text-center">
                <p class="text-muted">ليس لديك حساب؟ <a href="{% url 'register' %}" class="text-primary fw-bold">إنشاء حساب جديد</a></p>
                <a href="{% url 'landing_page' %}" class="btn btn-outline-secondary mt-2">العودة للرئيسية</a>
            </div>
        </div>
    </div>
</body>
</html>
