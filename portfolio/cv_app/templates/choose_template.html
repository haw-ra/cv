{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر قالب السيرة الذاتية</title>
    <!-- مكتبة البوتستراب الأساسية للتجاوب مع الموبايل -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f7f6; 
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif; 
        }
        .page-title { 
            color: #2c3e50; 
            font-weight: bold; 
            margin-top: 40px; 
            margin-bottom: 30px; 
            font-size: 2rem;
        }
        
        .template-radio { display: none; }
        
        /* تنسيق كارت القالب ليكون متساوي الطول */
        .template-card {
            border: 3px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fff;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .template-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); 
        }
        
        /* التأثير عند اختيار القالب */
        .template-radio:checked + .template-card {
            border-color: #0d6efd;
            background-color: #f8fbff;
            box-shadow: 0 0 15px rgba(13, 110, 253, 0.2);
        }

        /* تنسيق صورة القالب (السحر هنا) */
        .template-img {
            width: 100%;
            height: 280px; /* طول ثابت يمنع التمدد */
            object-fit: cover; /* يقص الصورة بشكل أنيق */
            object-position: top; /* يعرض فقط الجزء العلوي (الاسم والنبذة) */
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #eaeaea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* تنسيقات خاصة بشاشات الموبايل فقط */
        @media (max-width: 768px) {
            .page-title { font-size: 1.5rem; margin-top: 20px; }
            .template-img { height: 220px; } /* تصغير الصورة قليلاً لتناسب الموبايل */
            .template-card { margin-bottom: 10px; }
        }
    </style>
</head>
<body>

<div class="container pb-5">
    <h2 class="text-center page-title">✨ اختر تصميم سيرتك الذاتية</h2>
    
    <form method="POST" action="">
        {% csrf_token %}
        <!-- استخدام col-12 للموبايل و col-md-4 للديسكتوب -->
        <div class="row justify-content-center">
            
            <!-- القالب الكلاسيكي -->
            <div class="col-12 col-md-4 mb-4">
                <label class="w-100 h-100">
                    <input type="radio" name="cv_style" value="classic" class="template-radio" checked>
                    <div class="template-card">
                        <div>
                            <!-- تم التعديل إلى .jpg هنا -->
                            <img src="{% static 'images/classic.jpg' %}" alt="كلاسيك" class="template-img img-fluid">
                            <h4 class="mt-2">كلاسيكي</h4>
                            <p class="text-muted mb-0" style="font-size: 0.9rem;">رسمي وبسيط للشركات</p>
                        </div>
                    </div>
                </label>
            </div>

            <!-- القالب العصري الداكن -->
            <div class="col-12 col-md-4 mb-4">
                <label class="w-100 h-100">
                    <input type="radio" name="cv_style" value="modern-dark" class="template-radio">
                    <div class="template-card">
                        <div>
                            <!-- تم التعديل إلى .jpg هنا -->
                            <img src="{% static 'images/modern.jpg' %}" alt="مودرن" class="template-img img-fluid">
                            <h4 class="mt-2">عصري (داكن)</h4>
                            <p class="text-muted mb-0" style="font-size: 0.9rem;">ألوان غامقة وجذابة</p>
                        </div>
                    </div>
                </label>
            </div>

            <!-- القالب الأنيق -->
            <div class="col-12 col-md-4 mb-4">
                <label class="w-100 h-100">
                    <input type="radio" name="cv_style" value="elegant" class="template-radio">
                    <div class="template-card">
                        <div>
                            <!-- تم التعديل إلى .jpg هنا -->
                            <img src="{% static 'images/elegant.jpg' %}" alt="أنيق" class="template-img img-fluid">
                            <h4 class="mt-2">أنيق ومقسم</h4>
                            <p class="text-muted mb-0" style="font-size: 0.9rem;">تصميم بعمودين (احترافي)</p>
                        </div>
                    </div>
                </label>
            </div>

        </div>

    <!-- الأزرار متجاوبة مع الشاشات الصغيرة -->
        <div class="text-center mt-4 d-flex flex-column flex-md-row justify-content-center gap-3">
            <button type="submit" class="btn btn-primary btn-lg shadow px-5">حفظ وتطبيق القالب 🚀</button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-lg px-4">إلغاء</a>
        </div>
    </form>
</div>

<!-- إضافة سكربت البوتستراب لضمان سلاسة الواجهة -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
